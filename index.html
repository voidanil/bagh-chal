        <div class="game-title">
            <h1><u> Bagh-Chal</u></h1>
            <p>" <u>Game of Jungle</u> "</p>
        </div>
        <div class="rules">
            <h3><u>Rules</u></h3><br>

            <p>- Goat must trap all tigers with 20 pieces</p>

            <div class="col-box"></div>
            <div class="col-box"></div>
            <div class="inner-square"></div>
            <div class="dignl main"></div>
            <div class="dignl rev"></div>
        </div>
        <div id="modal-container">
            <div class="shadow"></div>
            <div id="modal-box">
